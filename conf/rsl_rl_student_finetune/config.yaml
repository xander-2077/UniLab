defaults:
  - _self_
  - task: go2_footstand/mujoco

algo:
  algo: rsl_rl_student_finetune
  algo_log_name: rsl_rl_student_finetune
  seed: 1
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 3000
  save_interval: 100
  empirical_normalization: true
  runner_class_name: OnPolicyRunner
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  experiment_name: student_finetune
  run_name: ""
  resume: false
  load_run: "-1"
  checkpoint: -1
  resume_path: null
  policy:
    actor_class_name: rsl_rl.models.MLPModel
    critic_class_name: rsl_rl.models.MLPModel
    init_noise_std: 0.35
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: elu
  algorithm:
    class_name: unilab.algos.torch.rsl_rl_ppo:TeacherRegularizedPPO
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.001
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 3.0e-4
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    target_kl_stop: null
    max_grad_norm: 1.0
    adaptive_kl_beta: 0.9
    adaptive_lr_growth: 1.1
    adaptive_lr_decay: 1.2
    adaptive_lr_update_interval: 5
    metrics_interval: 8
    finite_check_interval: 8
    enable_compile: false
    warmup_strict_iters: 10
    warmup_metrics_interval: 2
    warmup_finite_check_interval: 2
    disable_finite_checks: true
    teacher_regularization:
      enabled: true
      action_loss_coef: 0.05
      kl_loss_coef: 0.01

training:
  task_name: Go2FootStand
  device: null
  logger: tensorboard
  wandb_project: unilab
  wandb_entity: null
  wandb_group: null
  wandb_job_type: null
  wandb_name: null
  wandb_tags: []
  wandb_notes: null
  wandb_mode: null
  sim_backend: mujoco
  nan_guard:
    enabled: false
    buffer_size: 100
    max_envs_to_dump: 5
    output_dir: null
  play_only: false
  no_play: true
  play_render_mode: auto
  play_env_num: 16
  render_spacing: 1.0
  play_steps: 200
  cam_distance: 6.0
  cam_elevation: -20.0
  cam_azimuth: 90.0
  cam_lookat: null
  cam_tracking: false
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 2
  log_root: null
  num_timesteps: null
  log_dir: null

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
