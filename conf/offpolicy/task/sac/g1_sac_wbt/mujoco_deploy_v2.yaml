# @package _global_
# G1 WBT FastSAC mujoco — `deploy_v2` profile (Plan B / Stage 6).
#
# Yaml-only refinement layered on top of the validated Stage 4+5
# (mujoco_deploy.yaml). Goal: push tracking quality further without ANY code
# or deploy-side change. Does NOT modify mujoco_deploy.yaml, so the existing
# Stage 4+5 checkpoint (cyan curve) remains paired with its original yaml for
# reproducibility and can still be deployed via `--profile deploy`.
#
# Train command:
#   uv run train --algo sac --task g1_sac_wbt --sim mujoco --profile deploy_v2 \
#                training.use_amp=true
#
# Deploy compatibility: 100% identical to `deploy` profile.
#   - Same 154-dim actor obs, same channel order, same noise-config masking
#   - Same network input/output shape
#   - Same `scripts/deploy/sim_prototype.py` and ONNX export work unchanged
#   - C++ deploy code requires NO changes
#
# =============================================================================
# CHANGES from `deploy` profile (Stage 4+5):
# -----------------------------------------------------------------------------
# 1. algo.tau:                                 0.05 -> 0.005   [-10x]
#    Slower target Q tracking. Cyan run had critic_grad_norm 0.08 (vs yellow's
#    0.05) — critic is noisier than baseline. Slower target updates reduce
#    bootstrap variance, especially helpful under heavy DR. Standard SAC
#    practice for high-noise envs (mjlab/Holosoma defaults are mid 0.005-0.05).
#    Trade-off: learning slightly slower in early stages, but final policy
#    should be tighter.
#
# 2. reward.motion_global_root_pos:            1.0  -> 1.5     [+50%]
#    Stronger Q-bootstrap signal for "stay near reference position". Since
#    enable_zero_anchor_pos=true makes anchor_pos invisible to the actor, the
#    only learning signal is reward gradient through the critic. Bumping the
#    weight pushes the policy harder toward small drift. Won't fully break the
#    obs ceiling (true ceiling needs obs history) but should claim more of the
#    achievable margin (cyan 0.55 -> target 0.62-0.68).
#
# 3. reward.action_rate_l2:                    -0.1 -> -0.15   [+50% penalty]
#    Stronger smoothness penalty. Cyan's action_rate_l2 raw is around -0.27
#    weighted (yellow: -0.22 weighted at -0.1 weight). With -0.15 weight, raw
#    will appear larger in magnitude on the chart but physical jitter should
#    decrease. Sim2real friendly (lower motor current draw, less heating).
#
# 4. env.anchor_pos_z_threshold:               0.40 -> 0.30
#    Tighter implicit tracking pressure via termination. Forces policy to stay
#    closer to reference; risks higher terminated_rate (cyan baseline ~0.05;
#    expect 0.10-0.15 after this change). Approaching mjlab's 0.25.
#    ee_body_pos_z_threshold KEPT at 0.5 — green run history showed ee
#    termination is the main cause of catastrophic terminated_rate (0.4); only
#    tighten anchor.
#
# UNCHANGED from deploy profile (deliberate):
#   - 154-dim obs design (enable_zero_linvel=true, enable_zero_anchor_pos=true)
#   - All other reward weights (root_ori=1.0, body_*=1.0, joint_limit=-5.0,
#     joint_acc_l2=-2.5e-7, joint_torque_l2=-1e-5)
#   - All DR channels (push 300/200, friction, mass, com, kp/kd, encoder_bias)
#   - simulate_action_latency=true
#   - num_envs=4096, max_iterations=40000, etc.
# =============================================================================
# Expected results vs cyan (Stage 4+5 currently deployed):
#   - motion_global_root_pos raw:  0.55 -> 0.62-0.68
#   - motion_body_ori raw:         0.60 -> 0.65-0.70
#   - episode/length:              280  -> 270-280 (might dip slightly)
#   - episode/terminated_rate:     0.05 -> 0.10-0.15 (still acceptable)
#   - critic_grad_norm:            0.08 -> 0.05-0.06 (smoother critic)
#   - Visual:                      tighter dance, less position drift, smoother arms
#
# Decision after Plan B converges (~150 M env steps):
#   - If root_pos raw >= 0.65 AND visual notably better:
#       Plan B is the new base. Re-deploy with this checkpoint.
#   - If root_pos raw < 0.60 OR terminated_rate > 0.20:
#       Roll back partially. First try anchor_pos_z_threshold 0.30 -> 0.35,
#       then motion_global_root_pos 1.5 -> 1.2.
#   - If episode/length < 240 OR critic_grad_norm > 0.15:
#       tau 0.005 was too slow under noisy DR. Revert tau to 0.02 (mid value)
#       and keep the other three changes.
# =============================================================================
training:
  task_name: G1MotionTrackingSAC
  sim_backend: mujoco
algo:
  num_envs: 4096
  max_iterations: 40000
  save_interval: 1000
  # --- Plan B: tau slowed for critic stability under DR ---
  gamma: 0.99
  tau: 0.005                       # Plan B (was 0.05)
  num_atoms: 501
  updates_per_step: 4
  policy_frequency: 2
  use_symmetry: false
  algo_params:
    alpha_init: 0.1
    target_entropy_ratio: 0.5
    max_grad_norm: 10.0
env:
  control_config:
    action_scale: 2.0
    simulate_action_latency: true
  # Plan B: tighter anchor termination for implicit tracking pressure.
  anchor_pos_z_threshold: 0.30     # Plan B (was 0.40)
  # KEPT at 0.5 — green-run history shows ee termination causes terminated_rate
  # spikes; only tighten the anchor channel.
  ee_body_pos_z_threshold: 0.5
  truncate_on_clip_end: true
  noise_config:
    level: 1.0
    scale_joint_angle: 0.01
    scale_joint_vel: 0.5
    scale_gyro: 0.2
    enable_zero_linvel: true
    enable_zero_anchor_pos: true
    enable_anchor_ori_noise: true
    scale_anchor_ori: 0.05
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [-1.0, 1.0]
    random_com: true
    com_offset_x: [-0.05, 0.05]
    randomize_com_y: true
    com_offset_y: [-0.05, 0.05]
    randomize_com_z: true
    com_offset_z: [-0.05, 0.05]
    randomize_gravity: false
    gravity_range: [[0.0, 0.0, -9.81], [0.0, 0.0, -9.81]]
    push_robots: true
    push_interval: 200             # ≈4 s, same as Stage 4
    max_force: [300.0, 300.0, 120.0]   # Δv 0.2 m/s, same as Stage 4
    push_body_name: null
    randomize_kp: true
    kp_multiplier_range: [0.9, 1.1]
    randomize_kd: true
    kd_multiplier_range: [0.85, 1.15]
    randomize_geom_friction: true
    friction_range: [0.3, 1.2]
    friction_geom_pattern: "^(left|right)_foot[1-7]_collision$"
    enable_encoder_bias: true
    encoder_bias_range: [-0.01, 0.01]
reward:
  scales:
    # Plan B: bumped root_pos weight + stronger action_rate penalty.
    motion_global_root_pos: 1.5    # Plan B (was 1.0)
    motion_global_root_ori: 1.0
    motion_body_pos: 1.0
    motion_body_ori: 1.0
    motion_body_lin_vel: 1.0
    motion_body_ang_vel: 1.0
    motion_joint_pos: 0.0
    motion_joint_vel: 0.0
    action_rate_l2: -0.15          # Plan B (was -0.1)
    joint_limit: -5.0
    undesired_contacts: -0.1
    joint_acc_l2: -2.5e-7
    joint_torque_l2: -1e-5
