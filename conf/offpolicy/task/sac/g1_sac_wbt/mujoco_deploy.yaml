# @package _global_
# G1 Whole-Body Tracking (WBT) FastSAC on MuJoCo — `deploy` profile.
# Self-contained variant intended for sim2real-oriented training: enables the
# full domain-randomization stack and bumps env count / iteration budget.
# Kept independent from `mujoco.yaml` (no Hydra `defaults` inheritance) so
# tuning here cannot regress the baseline `--task g1_sac_wbt --sim mujoco` run.
#
# Sensor / DR ranges aligned with mjlab `Mjlab-Tracking-Flat-Unitree-G1-No-State-Estimation`
# and the real-machine-verified unitree_rl_lab `g1_29dof/dance_102` mimic task.
#
# =============================================================================
# CONVERGENCE FALLBACK LADDER — apply in order if training stalls.
# Train command: uv run train --algo sac --task g1_sac_wbt --sim mujoco \
#                              --profile deploy training.use_amp=true
# Decision metric: `reward/mean` and `episode/length` on TensorBoard.
#   Healthy convergence:  episode/length rises ≥250 by ~50 M env steps, and
#                         reward/mean keeps climbing past 100 M.
#   Stalled:              length plateaus <200 or oscillates ±30 for >30 M steps,
#                         or reward/mean drops while undesired_contacts swings.
# -----------------------------------------------------------------------------
# Stage 1 (DONE): reward retune toward mjlab parity.
#   - motion_global_root_pos: 1.0 -> 0.5  (avoid root-only solutions)
#   - motion_body_pos:        2.0 -> 1.0  (avoid local-tracking dominance over balance)
#   - joint_limit:           -2.0 -> -5.0 (stronger limit penalty; mjlab uses -10)
#   Result: episode/length 150 -> 210; body_pos raw reward EXCEEDS yellow; SAC
#   training dynamics healthy (alpha stable, action_std low, qf_loss declining).
#   Remaining symptom: torso swaying L/R — reward/motion_global_root_ori raw
#   value 0.54 (worse than green 0.8 and yellow 0.9). Diagnosis: with root:body
#   reward ratio at 1:4 and motion_anchor_pos_b zeroed from actor obs, the policy
#   only has motion_anchor_ori_b (6-d cols) as an OBSERVABLE root-state signal,
#   and its reward weight (0.5) is too small to compete with the 4.0 body cluster.
#
# Stage 1.5 (DONE): bumped motion_global_root_ori 0.5 -> 1.0.
#   Result: motion_global_root_ori raw 0.54 -> 0.85 (yellow=0.9, fully recovered);
#   episode/length 210 -> 250; terminated_rate 0.2 -> 0.08 (≈ yellow);
#   SAC dynamics healthy (actor_loss improved, critic_grad_norm stable).
#   Remaining visible symptom: large-amplitude lateral sway of the pelvis. This
#   maps to motion_global_root_pos raw 0.55 (yellow=0.95), NOT to root_ori
#   anymore — i.e. torso orientation tracks fine but the pelvis drifts under
#   pushes. Cause analysis:
#     * Physical: 600N x 0.02s = 0.4 m/s lateral velocity injection every 2 s;
#       recovery takes ~0.5-1 s, so root_pos error is non-zero a large fraction
#       of the time regardless of policy quality.
#     * Observation: enable_zero_anchor_pos=true hides motion_anchor_pos_b from
#       actor obs, so the policy can only detect lateral drift indirectly via
#       foot contact asymmetry / joint deviations.
#     * Conclusion: further reward retune on root_pos has limited effect because
#       the policy cannot directly perceive what it is being asked to minimize.
#       Must reduce the physical push source instead.
#
# Stage 2 (DONE): halved push intensity AND doubled interval.
#   - max_force: [600,600,240] -> [300,300,120], push_interval 100 -> 200.
#   Result: visible lateral sway ✅ reduced; episode/length 260 (best so far);
#   BUT motion_global_root_pos raw DEGRADED 0.54 -> 0.40 — tracking accuracy
#   actually got worse, contrary to expectation.
#   Cause: cutting push -75% removes ~4x the training samples where the policy
#   sees "drifted-from-reference -> recover" transitions. Combined with
#   enable_zero_anchor_pos=true (no anchor_pos signal in actor obs), the policy
#   loses its main pressure to stay near the reference and lets the root slowly
#   drift between sparse 4s pushes. The green-run evidence supports this:
#   green at push=600/100 + root_pos_weight=1.0 hit root_pos raw 0.55, slightly
#   better than gray/blue at push=600/100 + root_pos_weight=0.5 → push IS a
#   useful training signal for root_pos tracking, can't be cut too aggressively.
#
# Stage 2.5 (ACTIVE): rebalance push and explicitly compensate root_pos signal.
#   - max_force:     [300,300,120] -> [450, 450, 180]   # Δv 0.2 -> 0.3 m/s
#   - push_interval: 200           -> 150               # 4s -> 3s (mid of mjlab 1-3s)
#   - reward.motion_global_root_pos: 0.5 -> 1.0  (back to yellow/green level)
#   Rationale: ~50% push energy density vs Stage 1.5 (vs Stage 2's 25%) keeps
#   meaningful disturbance-rejection training; 3s interval is inside mjlab's
#   1-3s deployed range. Root_pos weight bumped to 1.0 to provide stronger
#   Q-bootstrap signal compensating for the obs zeroing — this is a
#   SAC+No-State-Estimation adaptation, NOT a deviation from mjlab parity
#   (mjlab uses 0.5 because it has anchor_pos directly in actor obs).
#   Sim2real impact: push DR matches mjlab interval range, Δv 0.3 m/s still
#   covers typical real-world bumps; all other DR (friction/mass/com/encoder/
#   kp/kd/latency) kept ON.
#
# Stage 3 (turn off action latency — if Stage 2.5 still stalls):
#   env.control_config.simulate_action_latency: true -> false
#   Train ~50 M steps without latency, save checkpoint, then re-enable latency
#   and fine-tune from that checkpoint.
#
# Stage 4 (mjlab-parity DR tightening — only if Stage 3 still stalls):
#     env.domain_rand.randomize_base_mass:  true -> false        # mjlab does not randomize
#     env.domain_rand.com_offset_x:         [-0.05, 0.05] -> [-0.025, 0.025]   # mjlab range
#     env.domain_rand.randomize_geom_friction: true -> false     # ablate friction DR
#     env.domain_rand.enable_encoder_bias:  true -> false        # ablate encoder bias
#
# Stage 5 (algo-side fine-tune — only if Stages 1-4 exhausted):
#     algo.tau:               0.05 -> 0.005          # slower target Q tracking
#     algo.updates_per_step:  4    -> 2              # reduce off-policy stale ratio
#     algo.algo_params.target_entropy_ratio: 0.5 -> 0.3
#
# TODO (NOT applied here, needs code change in src/unilab/envs/motion_tracking/g1/tracking.py
#       to register two new reward functions in `_init_reward_functions`):
#   - joint_acc_l2:    -2.5e-7   (mjlab parity — sim2real-friendly accel penalty)
#   - joint_torque_l2: -1e-5     (mjlab parity — sim2real-friendly torque penalty)
#   Adding these here without registering will be silently dropped at runtime
#   (see tracking.py reward loop: unknown names skipped).
# =============================================================================
training:
  task_name: G1MotionTrackingSAC
  sim_backend: mujoco
algo:
  num_envs: 4096
  max_iterations: 40000
  save_interval: 1000
  # --- holosoma WBT-specific overrides (vs sac.yaml defaults) ---
  gamma: 0.99
  tau: 0.05
  num_atoms: 501
  updates_per_step: 4
  policy_frequency: 2
  use_symmetry: false
  algo_params:
    alpha_init: 0.1
    target_entropy_ratio: 0.5
    max_grad_norm: 10.0
env:
  control_config:
    action_scale: 2.0
    # One-step action latency: model the SDK send/recv delay so the trained
    # actor sees the same delayed feedback the C++ controller will produce.
    simulate_action_latency: true
  anchor_pos_z_threshold: 0.5
  ee_body_pos_z_threshold: 0.5
  truncate_on_clip_end: true
  noise_config:
    level: 1.0
    scale_joint_angle: 0.01      # mjlab parity (uniform per-step)
    scale_joint_vel: 0.5         # mjlab parity (was 1.5 — too aggressive)
    scale_gyro: 0.2              # mjlab parity
    # mjlab "No-State-Estimation" parity: G1 has no torso-pose estimator and
    # no base linvel sensor at deploy → drop both channels from actor obs.
    # critic still sees the clean values (asymmetric A/C).
    enable_zero_linvel: true
    enable_zero_anchor_pos: true
    # Anchor orientation noise (mjlab Unoise(±0.05) on the 6-d rotation cols).
    enable_anchor_ori_noise: true
    scale_anchor_ori: 0.05
  # Domain randomization switches — aligned with Domain_Rand fields available
  # to G1MotionTrackingEnv (see src/unilab/envs/motion_tracking/g1/tracking.py).
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [-1.0, 1.0]    # tightened from ±1.5; mjlab does not randomize
    random_com: true
    com_offset_x: [-0.05, 0.05]
    randomize_com_y: true            # mjlab base_com offset is 3-axis
    com_offset_y: [-0.05, 0.05]
    randomize_com_z: true
    com_offset_z: [-0.05, 0.05]
    randomize_gravity: false         # mjlab does not randomize; ranges were no-op anyway
    gravity_range: [[0.0, 0.0, -9.81], [0.0, 0.0, -9.81]]
    push_robots: true
    # Stage 2.5: 150 ctrl steps ≈ 3 s, inside mjlab's deployed 1-3 s window.
    # (was 100 in Stage 1.5, 200 in Stage 2; Stage 2 was too sparse and let
    # root drift between pushes.)
    push_interval: 150
    # Stage 2.5: Δv 0.3 m/s — between Stage 1.5's 0.4 (too brutal for SAC)
    # and Stage 2's 0.2 (too weak; tracking signal degraded). 0.3 m/s on a
    # ~30 kg base over one ctrl_dt: F = m·Δv/dt → ±450/450/180 N.
    # ~50% energy density of mjlab parity; still covers typical real-world
    # disturbances (foot slip ~0.1-0.15 m/s, light bumps ~0.2 m/s).
    max_force: [450.0, 450.0, 180.0]
    push_body_name: null             # default = pelvis (free-joint root)
    randomize_kp: true
    kp_multiplier_range: [0.9, 1.1]
    randomize_kd: true
    kd_multiplier_range: [0.85, 1.15]
    # mjlab parity: foot geom friction sampled per-episode, shared across feet,
    # absolute value uniform in (0.3, 1.2) on the sliding-friction column.
    randomize_geom_friction: true
    friction_range: [0.3, 1.2]
    friction_geom_pattern: "^(left|right)_foot[1-7]_collision$"
    # mjlab parity: persistent ±0.01 rad encoder bias added to actor's joint_pos.
    enable_encoder_bias: true
    encoder_bias_range: [-0.01, 0.01]
reward:
  scales:
    # Stage 2.5 active: root_pos back to 1.0 to compensate for the missing
    # anchor_pos obs channel; other weights kept from Stage 1.5.
    motion_global_root_pos: 1.0       # Stage 2.5 (was 0.5; compensate obs zeroing of anchor_pos)
    motion_global_root_ori: 1.0       # Stage 1.5 (was 0.5; restore root attitude authority)
    motion_body_pos: 1.0              # Stage 1 (mjlab parity, was 2.0)
    motion_body_ori: 1.0              # mjlab parity (kept)
    motion_body_lin_vel: 1.0          # mjlab parity (kept)
    motion_body_ang_vel: 1.0          # mjlab parity (kept)
    motion_joint_pos: 0.0             # not used in mjlab dance_102
    motion_joint_vel: 0.0             # not used in mjlab dance_102
    action_rate_l2: -0.1              # mjlab parity (kept)
    joint_limit: -5.0                 # Stage 1 (mjlab parity direction, was -2.0)
    undesired_contacts: -0.1          # mjlab parity (kept)
